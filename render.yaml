services:
  - type: web
    name: autovid-painel
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_VISIBILITY
        value: private
      - key: PANEL_USER
        value: admin
      - key: PANEL_PASS
        value: troque-isto
